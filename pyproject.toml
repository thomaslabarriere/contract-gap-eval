[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contract-gap-eval"
version = "0.1.0"
description = "A contract-vs-policy gap-analysis agent + a gap-recall reliability harness for legal review."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "openai>=1.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
contract-gap-eval = "contractgap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/contractgap"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# The corpus modules are literal legal text (long French clauses); line-length
# is not meaningful there. Code modules stay at 100.
[tool.ruff.lint.per-file-ignores]
"src/contractgap/contracts.py" = ["E501"]
"src/contractgap/goldset.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/contractgap"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
